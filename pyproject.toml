[tool.poetry]
name = "tool-tui"
version = "0.1.1"
description = "A TUI for managing unattended tools and processes"
authors = []
readme = "README.md"
packages = [{include = "tool_tui"}]

[tool.poetry.scripts]
tool-tui = "tool_tui.__main__:main"

[tool.poetry.dependencies]
python = "^3.12"
textual = "^1.0"
pyyaml = "^6.0"
pydantic = "^2.0"
fastapi = "^0.115"
uvicorn = "^0.34"

[tool.poetry.group.dev.dependencies]
black = "^24.8"
flake8 = "^7.1"
pre-commit = "^4.0"
pytest = "^8.0"
httpx = "^0.28.1"

[tool.black]
line-length = 120

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
